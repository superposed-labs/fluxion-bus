name: 💡 Feature request
description: Suggest an idea or enhancement for Fluxion
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions and this hasn't been requested.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: >-
        What are you trying to do, and what's getting in the way?
        ("I'm always frustrated when…")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - MCP server / sub-agent delegation
        - Messaging gateway (Slack / Telegram / WeChat / LINE / QQ / Feishu)
        - Web console (fluxion-web)
        - Scheduler
        - Quota & usage monitoring
        - macOS desktop app
        - CLI / installation
        - Docs
        - Other
    validations:
      required: false
