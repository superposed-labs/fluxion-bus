name: macOS App Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Fluxion.app
    # macos-26: the linked macOS SDK must be current — on macOS 26 (Tahoe)
    # hosts, WKWebView renders legacy light-colored native scrollbars in apps
    # linked against pre-26 SDKs, ignoring the console's scrollbar CSS. The
    # deployment target stays macOS 12.0 (set in desktop/build.sh).
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so build.sh's `git rev-list --count HEAD` yields a
          # real, monotonically increasing CFBundleVersion — Sparkle compares
          # that number to decide whether an update is newer. A shallow (depth
          # 1) clone would make every release build number 1 and silently
          # break auto-updates.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          if [ -z "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" ]; then
            echo "No Developer ID certificate configured; skipping certificate import."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package app
        env:
          FLUXION_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Stamp the app's user-facing version from the pushed tag
          # (v1.2.3 -> 1.2.3) so CFBundleShortVersionString never needs a
          # hand edit. build.sh falls back to `git describe` for local builds.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export FLUXION_APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$FLUXION_CODESIGN_IDENTITY" ] \
            && [ -n "$APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64" ] \
            && [ -n "$APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD" ] \
            && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_TEAM_ID" ] \
            && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            export FLUXION_NOTARIZE=1
          else
            echo "::warning::Developer ID signing/notarization secrets are incomplete; building an ad-hoc test artifact."
            export FLUXION_CODESIGN_IDENTITY=
            export FLUXION_NOTARIZE=0
          fi
          scripts/package-macos-app.sh

      - name: Checksums
        run: |
          shasum -a 256 dist/macos/Fluxion.dmg dist/macos/Fluxion.app.zip \
            | tee dist/macos/SHA256SUMS

      # Generate the EdDSA-signed Sparkle appcast so already-installed users
      # receive in-app auto-updates. Requires the SPARKLE_PRIVATE_KEY secret
      # (the base64 seed from `generate_keys -x`). Skipped when the secret is
      # absent; the download-url-prefix points at this tag's release assets.
      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/') && env.SPARKLE_PRIVATE_KEY != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_VERSION=2.9.4
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p /tmp/sparkle-tools
          tar -xJf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools bin
          mkdir -p appcast-src
          cp dist/macos/Fluxion.app.zip appcast-src/
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_ed_key
          /tmp/sparkle-tools/bin/generate_appcast \
            --ed-key-file /tmp/sparkle_ed_key \
            --download-url-prefix "https://github.com/superposed-labs/fluxion-bus/releases/download/${GITHUB_REF_NAME}/" \
            appcast-src
          cp appcast-src/appcast.xml dist/macos/appcast.xml
          rm -f /tmp/sparkle_ed_key

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fluxion-macos-app
          path: |
            dist/macos/Fluxion.dmg
            dist/macos/Fluxion.app.zip
            dist/macos/SHA256SUMS
            dist/macos/appcast.xml

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/macos/Fluxion.dmg
            dist/macos/Fluxion.app.zip
            dist/macos/SHA256SUMS
            dist/macos/appcast.xml

      # Bump the fluxion cask in superposed-labs/homebrew-tap to the new
      # version + DMG sha256 (read from SHA256SUMS). Self-contained so it needs
      # no third-party action. Requires the HOMEBREW_TAP_TOKEN secret (a PAT
      # with write access to the tap); skipped automatically when absent.
      - name: Bump Homebrew cask
        if: startsWith(github.ref, 'refs/tags/') && env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg_sha="$(awk '/Fluxion\.dmg/ {print $1}' dist/macos/SHA256SUMS)"
          if [ -z "$dmg_sha" ]; then
            echo "::error::could not read Fluxion.dmg sha256 from SHA256SUMS"
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/superposed-labs/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"${version}\"/" Casks/fluxion.rb
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"${dmg_sha}\"/" Casks/fluxion.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/fluxion.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
          else
            git commit -m "fluxion ${version}"
            git push
          fi

      - name: Delete signing keychain
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          fi
